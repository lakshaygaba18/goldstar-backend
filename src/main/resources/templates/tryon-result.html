<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>GoldStar Virtual Try-On</title>

    <style>

        *{
            box-sizing:border-box;
        }

        body{
            margin:0;
            background:#f5f5f5;
            font-family:Arial,sans-serif;
        }

        .container{
            max-width:650px;
            margin:40px auto;
            background:white;
            border-radius:15px;
            overflow:hidden;
            box-shadow:0 5px 20px rgba(0,0,0,.15);
        }

        .header{
            background:#111827;
            color:white;
            padding:22px;
            text-align:center;
            font-size:28px;
            font-weight:bold;
        }

        .content{
            padding:30px;
            text-align:center;
        }

        img{
            width:100%;
            border-radius:12px;
        }

        h2{
            margin-top:25px;
        }

        .status{
            margin-top:20px;
            display:inline-block;
            background:#16a34a;
            color:white;
            padding:10px 22px;
            border-radius:30px;
            font-weight:bold;
        }

        p{
            color:#555;
            font-size:18px;
        }

        .button{
            display:inline-block;
            margin-top:25px;
            background:#f59e0b;
            color:white;
            padding:15px 30px;
            text-decoration:none;
            border-radius:10px;
            font-size:18px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">
        GoldStar Virtual Try-On
    </div>

    <div class="content">

        <img
                th:src="${resultImageUrl}"
                alt="Try-On Result"/>

        <h2 th:text="${garmentName}">
            Garment Name
        </h2>

        <div
                class="status"
                th:text="${status}">
            COMPLETED
        </div>

        <p>
            Generated using
            <span th:text="${modelProvider}">
                RODIN
            </span>
        </p>

        <a
                class="button"
                th:href="${resultImageUrl}">
            Download Image
        </a>

    </div>

</div>

</body>

</html>
